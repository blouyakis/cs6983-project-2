openapi: 3.0.3
info:
  title: Everyday planning and shared costs
  version: 0.1.0
  description: |
    Draft route list moved from AGENTS.md. A personal space is a group with
    `isPersonal: true` and uses the same group routes. Paths are plural
    kebab-case. JSON keys are camelCase.

    Status codes: 400 invalid input, 401 not logged in or token expired,
    403 logged in but not allowed, 404 not found, 409 conflict (duplicate
    email, inviting someone already in the group, a group that already has
    12 members, editing a settled expense, leaving with a balance).

    Error body: { "error": { "code": "FORBIDDEN", "message": "You are not a member of this group." } }
security:
  - sessionCookie: []
paths:
  /api/auth/register:
    post:
      summary: Create an account (also creates the personal space)
      description: |
        Issues #4, #23. Stores the email lowercase and the password as a
        bcrypt hash (cost 12), then sets the `session` cookie. The personal
        space is not created yet (#23).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created. Sets the `session` cookie.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: |
            Invalid input. `fields` names each bad field, for example
            `{ "password": "Password must be at least 8 characters." }`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`An account with this email already exists.`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/login:
    post:
      summary: Log in, set the session cookie
      description: Issue #4.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in. Sets the `session` cookie.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          description: |
            Wrong email or password. The message is always
            `Email or password is incorrect.`, so it does not reveal which
            emails have accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/logout:
    post:
      summary: Clear the session cookie
      description: |
        Issue #4. Works without a valid session, so an expired cookie is
        cleared the same way.
      security: []
      responses:
        "204":
          description: Logged out. Sets `session` to empty with `Max-Age=0`.
  /api/auth/me:
    get:
      summary: Current user
      description: Issue #4.
      responses:
        "200":
          description: The user the session belongs to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: |
            No session, an invalid token, or an expired token
            (`Your session has expired. Please log in again.`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/health:
    get:
      summary: Whether the app and the database are up
      description: |
        Issue #100. Works without a session, so it says only up or down: no
        error message, version or environment name. It runs a cheap query
        (`db_now()`) on every request, gives up on it after 3 seconds, and is
        never cached. Its `503` body is not the shared `Error` shape, so a
        monitor only has to read `status`.
      security: []
      responses:
        "200":
          description: The app answered and could query the database.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
        "503":
          description: The app answered but the database failed or took more than 3 seconds.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: error
  /api/overview:
    get:
      summary: Personal total, share per group, net balance
      description: |
        Issue #10. The landing screen's numbers for the session user. Each
        group's balance comes from the same calculation as
        `GET /api/groups/{groupId}/balances` (#9). The net covers only the
        groups the user is in now: the personal space has no balance, and a
        group the user left or that was archived is listed apart.
      responses:
        "200":
          description: The user's overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewResponse"
        "401":
          $ref: "#/components/responses/Error"
  /api/sidebar-groups:
    get:
      summary: The sidebar's groups, with my balance in each shared one
      description: |
        Issue #89. The groups the sidebar lists: the personal space and every
        group the user is in now, without the groups they left or that were
        archived. The `(app)` layout isn't rendered again on client
        navigation, so the sidebar asks for this after each one, and it shows
        balances and groups that another member changed. Each balance comes
        from the same calculation as `GET /api/groups/{groupId}/balances`
        (#9). A group whose balance can't be loaded is still listed, without
        `balanceCents`. Sent with `Cache-Control: no-store`.
      responses:
        "200":
          description: The user's sidebar groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SidebarGroupListResponse"
        "401":
          $ref: "#/components/responses/Error"
  /api/groups:
    get:
      summary: List my groups
      description: |
        Issue #6. Every group the user is or was in: the personal space
        first, then groups they can write to, then read-only ones (left or
        archived). Each lists its current members.
      responses:
        "200":
          description: The user's groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListResponse"
        "401":
          $ref: "#/components/responses/Error"
    post:
      summary: Create a group
      description: |
        Issue #6. The session user becomes its first member, at share
        weight 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: The new group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          description: 'Invalid input, for example `{ "name": "Enter a group name." }`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}:
    get:
      summary: Group details
      description: |
        Issues #5, #6, #8. Current and former members can read it; anyone
        else, and a group that does not exist, gets 403. `members` lists
        the current members with their default share weights, which
        `SplitEditor` fills custom amounts from.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          description: "`groupId` is not a UUID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    patch:
      summary: Rename a group or set its default split ratio
      description: |
        Issues #6, #8. Send `name`, `memberWeights`, or both. The weights
        must list every current member exactly once. They are the default
        for new expenses only; existing expenses keep their shares. Former
        members and archived groups get 403, and so does a personal space,
        which has no name or split to change (#23).
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupRequest"
      responses:
        "200":
          description: The group after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          description: |
            Invalid input, such as a weight of 0, or weights that leave out
            or add a member: `{ "memberWeights": "List a weight for every
            current member." }`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/invitations:
    post:
      summary: Invite by email
      description: |
        Issue #6. Any current member can invite someone who already has an
        account. The invitee joins right away at share weight 1; there is
        no accept step. A former member rejoins from now.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: The new member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "400":
          description: 'Invalid input, for example `{ "email": "Enter a valid email address." }`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          description: |
            A former member, an archived group, a personal space ("A
            personal space can't have other members."), or a user outside the
            group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`No LifeBoard account uses that email.`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`They are already in this group.` or `A group can have at most 12 members.`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/groups/{groupId}/leave:
    post:
      summary: Leave a group
      description: Issue #22. Leaving with a non-zero balance is 409.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "409":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/list-items:
    get:
      summary: List items
      description: |
        Issues #11, #12. Open items first, then done items, newest first in
        each. `addedBy` is a user id; the page names them from the group's
        members. A former member only sees what was added before they left.
        Each item also has `costCents`, what a done item cost, and
        `expenseLock`, whether its expense is settled or in the open
        settle-up (#12, #86), so the client never offers an uncheck that
        would get a 409.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: The group's list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListItemListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      summary: Add an item
      description: |
        Issue #11. The item is added by the session user: the body has no
        `addedBy`, and one sent anyway is ignored. Only current members of an
        active group can add; a former member or an archived group gets 403.
        Works the same in a personal space.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListItemRequest"
      responses:
        "201":
          description: The new item, open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListItemResponse"
        "400":
          description: |
            Invalid input, keyed by field: `title`, `quantity` or
            `estimatedCents` (0 or below, or not whole) or `note`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/list-items/{itemId}:
    patch:
      summary: Edit an open item
      description: |
        Issue #11. Any current member can edit an open item, whoever added
        it. Only the fields sent change; null clears a quantity, note or
        estimate. A done item is 409: uncheck it first (#12).
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateListItemRequest"
      responses:
        "200":
          description: The edited item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListItemResponse"
        "400":
          description: Invalid input, keyed by field, or a body with no field to change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete an open item
      description: |
        Issue #11. Any current member can delete an open item, and the row is
        removed. A done item is 409: uncheck it first (#12).
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204":
          description: Deleted.
        "400":
          description: The group id or the item id isn't a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/list-items/{itemId}/complete:
    post:
      summary: Check off an item and create the expense
      description: |
        Issue #12. The current user is the payer and the one who completed
        it. The body is the actual cost and the same split fields as adding
        an expense (`Split`); the server works out the shares. With a cost,
        the expense is created and linked to the item in one transaction;
        with a cost of 0 the item is only marked done and the split is
        ignored. In the personal space the owner is the only sharer, whatever
        split is sent (#23). An item that is already done is 409, one that
        isn't in the group is 404, and a former member or an archived group
        gets 403.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [amountCents]
                  properties:
                    amountCents:
                      $ref: "#/components/schemas/AmountCents"
                - $ref: "#/components/schemas/Split"
      responses:
        "200":
          description: Item checked off. Expense created if amountCents > 0.
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: "#/components/schemas/ListItem"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/list-items/{itemId}/reopen:
    post:
      summary: Uncheck an item and delete its expense
      description: Issue #12. Only the member who checked the item off; anyone else gets 403. An expense that is settled or in the open settle-up is 409 (#86). A done item with no expense just reopens. An item that is already open is 409, and one that isn't in the group is 404.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Item reopened. Expense deleted if it existed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: "#/components/schemas/ListItem"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/expenses:
    get:
      summary: List expenses (with filters)
      description: |
        Issues #7, #15. The group's expenses, newest day first and, within a
        day, newest entry first. A former member only sees what was added
        before they left. The filters are #15.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: The group's expenses, each with its shares.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      summary: Add an expense
      description: |
        Issues #7, #15. The payer is always the session user: the body has
        no payer field, and one sent anyway is ignored (AGENTS.md Section
        6.7). The expense and its shares are written in one transaction.
        Only current members of an active group can add; a former member or
        an archived group gets 403. In a personal space the user is the only
        sharer.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseRequest"
      responses:
        "201":
          description: The new expense.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseResponse"
        "400":
          description: |
            Invalid input. Each error is keyed by a top-level field, such as
            `amountCents`, `spentOn`, `sharedBy` (someone who isn't a current
            member, or a payer who isn't sharing) or `amountsCents` (custom
            amounts that don't add up).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/expenses/{expenseId}:
    patch:
      summary: Edit an unsettled expense
      description: |
        Issue #20. Replaces the description, amount, day and split together,
        in one transaction, and marks the expense edited (`editedAt`). Only
        the payer may edit (anyone else gets 403), and only while the expense
        is unsettled (409 once it is in a closed settlement) and not in an
        open settle-up (409 while a settle-up started on or after its
        `createdAt` is open, #86). The payer can't
        be changed: the body has no payer field, and one sent anyway is
        ignored (AGENTS.md Section 6.7). The payer must stay one of the
        sharers, or the request is 400 on `sharedBy`. A former member or an
        archived group gets 403. Balances are computed per request, so they
        reflect the edit at once.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/ExpenseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseRequest"
      responses:
        "200":
          description: The edited expense.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete an unsettled expense
      description: |
        Issue #20. Only the payer, and only while the expense is unsettled
        (409 once settled, and 409 while it is in an open settle-up, #86;
        anyone else gets 403). The shares go with it. A
        list item the expense came from stays checked off with no expense;
        unchecking the item is #12.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/ExpenseId"
      responses:
        "204":
          description: The expense is gone.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/balances:
    get:
      summary: Each member's net balance
      description: |
        Issue #9. Each member's balance in cents for the current period:
        what they paid, minus their shares, plus confirmed payments they
        sent, minus confirmed payments they received, over expenses and
        payments that are unsettled or in the open settle-up (AGENTS.md
        Section 6.4). Positive means the group owes them; negative means
        they owe. Balances are computed on every request and never stored,
        and they always add up to zero. A former member sees the balances
        as they were when they left. Someone in an unsettled expense who
        has since left is included, so the sum stays zero.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: One balance per member, in the order they joined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/bills/me:
    get:
      summary: My itemized bill (current or past period)
      description: Issue #21.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "403":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/payments:
    get:
      summary: List the group's payments
      description: |
        Issue #14. Every payment someone has sent, direct or from a
        settle-up: `paid` and `confirmed` ones, last paid first. A
        `suggested` payment is only a plan and is listed by the settle-up
        instead. A former member only sees payments created before they
        left.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: The group's paid and confirmed payments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentListResponse"
        "400":
          description: The group id isn't a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      summary: Record a direct payment
      description: |
        Issue #14, user flow 6. Records money the session user sent another
        current member outside the app (AGENTS.md Section 6.9). The sender
        is always the session user: the body has no sender field, and one
        sent anyway is ignored. The payment starts as `paid`, with `paidAt`
        from the database's clock, and changes no balance until the
        recipient confirms it with `/payments/{paymentId}/confirm`. The
        recipient can decline it instead with `/payments/{paymentId}/decline`,
        which deletes it (#108). One
        recorded while a settle-up is open belongs to the next period. A
        former member or an archived group gets 403.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: The new payment, marked paid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          description: |
            Invalid input, keyed by field: `amountCents` (not a whole number
            of cents from 1 up) or `toUserId` (not a UUID, the session user,
            or someone who isn't a current member of the group).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/payments/{paymentId}/paid:
    post:
      summary: Sender marks a suggested payment paid
      description: |
        Issue #19. The person paying says they sent the money, for example
        by Venmo. Only the sender may; the recipient and everyone else get
        403. A payment that is already paid or confirmed is 409. Balances
        don't change until the recipient confirms.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: The payment, now marked paid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          description: The group id or the payment id isn't a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/payments/{paymentId}/confirm:
    post:
      summary: Recipient confirms a payment
      description: |
        Issues #14, #19. The person receiving the money says it arrived.
        Only the recipient may; the sender and everyone else get 403. A
        payment that isn't marked paid is 409. When it was the last payment
        of an open settle-up, the period closes in the same transaction:
        `closed` is true, and the expenses created and direct payments
        confirmed before the settle-up started are locked.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: The confirmed payment, and whether the period closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmPaymentResponse"
        "400":
          description: The group id or the payment id isn't a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/payments/{paymentId}/decline:
    post:
      summary: Recipient declines a payment marked paid
      description: |
        Issue #108. The person receiving the money says it never arrived.
        Only the recipient may; the sender and everyone else get 403. A
        payment that isn't marked paid is 409, including one that a confirm
        reached first. A settle-up payment goes back to `suggested` with
        `paidAt` null, so the sender can mark it paid again, and the
        settle-up can be cancelled again once every payment in it is
        suggested. A direct payment never counted in a balance, so it is
        deleted: 204, and a later request for it is 404.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: The settle-up payment, back to suggested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "204":
          description: The direct payment is gone.
        "400":
          description: The group id or the payment id isn't a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/settlements:
    get:
      summary: Closed past periods
      description: |
        Issue #19. The group's closed settle-ups, newest first, each with
        how many expenses and payments it settled (DESIGN.md "PastPeriods").
        A former member only sees periods started before they left.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: The closed periods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      summary: Start a settle-up and get suggested payments
      description: |
        Issue #19. Any current member can start one. The app takes a
        cut-off from the database clock, reads the balances up to it and
        suggests the fewest payments that zero every balance, found with an
        exact subset search (AGENTS.md Section 6.5); the database checks
        those balances against its own as of the cut-off before storing the
        settle-up, and the app reads again if a cost landed in between (#86).
        Expenses and direct payments added afterwards belong to the next
        period and don't change the suggested payments; the expenses in the
        period are frozen until it closes. With nothing
        to pay, the settle-up is returned already closed and the period's
        rows are locked. A group can have one open settle-up at a time: 409
        while one is open. A personal space has nothing to settle: 409.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "201":
          description: The new settle-up with its suggested payments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettleUpResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/settlements/current:
    get:
      summary: Current settle-up and its payments
      description: |
        Issue #19. The open settle-up with every payment it suggested and
        each one's status. 404 when none is open, or for a former member
        when it started after they left.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: The open settle-up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettleUpResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/settlements/current/cancel:
    post:
      summary: Cancel the open settle-up
      description: |
        Issue #19. Any current member can cancel while every payment is
        still suggested. The suggested payments are deleted and the
        expenses stay unsettled. Once a payment is marked paid, the
        settle-up can only close: 409. 404 when none is open.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "204":
          description: Cancelled.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: |
        HS256 JWT holding only the user id, valid for 24 hours. Set as an
        httpOnly, Secure, SameSite=Lax cookie by register and login.
  headers:
    SessionCookie:
      description: "`session=<jwt>; Path=/; Max-Age=86400; HttpOnly; Secure; SameSite=Lax`"
      schema:
        type: string
  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
  schemas:
    Split:
      description: |
        Issue #8. How an expense is split, from `splitSchema` in
        `src/lib/validation/splits.ts`. These fields sit at the top level of
        the request body that adds, checks off or edits an expense, and a
        400 keys each error by one of them. The payer is always one of
        `sharedBy`. An even split gives any leftover cent to the payer;
        custom amounts must add up to the expense amount. The expense amount
        and each custom amount are `AmountCents`.
      oneOf:
        - $ref: "#/components/schemas/SplitEven"
        - $ref: "#/components/schemas/SplitCustom"
      discriminator:
        propertyName: mode
        mapping:
          even: "#/components/schemas/SplitEven"
          custom: "#/components/schemas/SplitCustom"
    SplitEven:
      type: object
      required: [mode, sharedBy]
      properties:
        mode:
          type: string
          enum: [even]
        sharedBy:
          $ref: "#/components/schemas/SharedBy"
    SplitCustom:
      type: object
      required: [mode, sharedBy, amountsCents]
      properties:
        mode:
          type: string
          enum: [custom]
        sharedBy:
          $ref: "#/components/schemas/SharedBy"
        amountsCents:
          type: object
          description: Each sharer's share in cents, keyed by user id.
          additionalProperties:
            $ref: "#/components/schemas/AmountCents"
          example:
            6f1c2d4e-1111-4222-8333-944455556666: 601
            0b7e8a10-2222-4333-8444-a55566667777: 400
    AmountCents:
      type: integer
      description: |
        An amount in whole cents. The maximum is the most a Postgres
        `integer` holds (`MAX_CENTS` in `src/lib/domain/splits.ts`), so a
        bigger amount is a 400 on its field rather than a database error.
      minimum: 0
      maximum: 2147483647
      example: 1001
    SharedBy:
      type: array
      description: |
        The user ids of the members who share the expense, each once. Ids
        are compared in any case and stored in lowercase, here and as the
        keys of `amountsCents`, so the same id twice in different case is
        a 400.
      minItems: 1
      uniqueItems: true
      items:
        type: string
        format: uuid
    CreateExpenseRequest:
      description: |
        Issue #7. The `Split` fields (`mode`, `sharedBy`, and `amountsCents`
        for a custom split) sit at the top level, next to the expense's own.
      allOf:
        - type: object
          required: [description, amountCents, spentOn]
          properties:
            description:
              type: string
              description: Trimmed.
              minLength: 1
              maxLength: 100
              example: Electricity
            amountCents:
              $ref: "#/components/schemas/AmountCents"
            spentOn:
              type: string
              format: date
              description: |
                The day it was spent, with no time zone. Not in the future:
                the latest day allowed is tomorrow in UTC, so someone east of
                UTC can still enter their own today.
              example: "2026-11-02"
        - $ref: "#/components/schemas/Split"
    Expense:
      type: object
      required:
        [
          id,
          groupId,
          description,
          amountCents,
          payerId,
          spentOn,
          settled,
          createdAt,
          editedAt,
          shares,
        ]
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        description:
          type: string
        amountCents:
          $ref: "#/components/schemas/AmountCents"
        payerId:
          type: string
          format: uuid
        spentOn:
          type: string
          format: date
        settled:
          type: boolean
          description: |
            True once a settle-up has closed over it. A settled expense is
            locked, so the client doesn't offer an edit or a delete.
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
          nullable: true
        shares:
          type: array
          description: Who shares the expense. The shares add up to `amountCents`.
          items:
            type: object
            required: [userId, shareCents]
            properties:
              userId:
                type: string
                format: uuid
              shareCents:
                $ref: "#/components/schemas/AmountCents"
    ExpenseResponse:
      type: object
      required: [expense]
      properties:
        expense:
          $ref: "#/components/schemas/Expense"
    ExpenseListResponse:
      type: object
      required: [expenses]
      properties:
        expenses:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
    Balance:
      type: object
      required: [userId, balanceCents]
      properties:
        userId:
          type: string
          format: uuid
        balanceCents:
          type: integer
          description: Positive when the group owes this member, negative when they owe the group.
          example: -883
    BalanceListResponse:
      type: object
      required: [balances]
      properties:
        balances:
          type: array
          items:
            $ref: "#/components/schemas/Balance"
    Payment:
      type: object
      description: |
        Money sent outside the app (architecture.md "Payment lifecycle").
        `suggested` by a settle-up, `paid` once the sender marks it, and
        `confirmed` once the recipient does; only confirmed payments count
        in balances.
      required:
        [
          id,
          groupId,
          fromUserId,
          toUserId,
          amountCents,
          status,
          settlementId,
          createdAt,
          paidAt,
          confirmedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        fromUserId:
          type: string
          format: uuid
        toUserId:
          type: string
          format: uuid
        amountCents:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [suggested, paid, confirmed]
        settlementId:
          type: string
          format: uuid
          nullable: true
          description: The settle-up that suggested it, or that closed over a direct payment. Null for a direct payment in the current period.
        createdAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
          nullable: true
        confirmedAt:
          type: string
          format: date-time
          nullable: true
    PaymentResponse:
      type: object
      required: [payment]
      properties:
        payment:
          $ref: "#/components/schemas/Payment"
    CreatePaymentRequest:
      type: object
      description: Issue #14. There is no sender field; the sender is the session user.
      required: [toUserId, amountCents]
      properties:
        toUserId:
          type: string
          format: uuid
          description: Another current member of the group.
        amountCents:
          allOf:
            - $ref: "#/components/schemas/AmountCents"
          minimum: 1
          example: 883
    PaymentListResponse:
      type: object
      required: [payments]
      properties:
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
    ConfirmPaymentResponse:
      type: object
      required: [payment, closed]
      properties:
        payment:
          $ref: "#/components/schemas/Payment"
        closed:
          type: boolean
          description: True when this was the last payment of an open settle-up, which then closed.
    Settlement:
      type: object
      description: One settle-up period (AGENTS.md Section 6.10).
      required: [id, groupId, status, startedBy, startedAt, closedAt]
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        status:
          type: string
          enum: [open, closed, cancelled]
        startedBy:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: When it closed or was cancelled. Null while open.
    SettleUp:
      allOf:
        - $ref: "#/components/schemas/Settlement"
        - type: object
          required: [payments]
          properties:
            payments:
              type: array
              description: The payments it suggested, oldest first.
              items:
                $ref: "#/components/schemas/Payment"
    SettleUpResponse:
      type: object
      required: [settleUp]
      properties:
        settleUp:
          $ref: "#/components/schemas/SettleUp"
    Period:
      allOf:
        - $ref: "#/components/schemas/Settlement"
        - type: object
          required: [expenseCount, paymentCount]
          properties:
            expenseCount:
              type: integer
              description: Expenses locked into this period.
            paymentCount:
              type: integer
              description: Payments in this period, suggested by it or direct ones it closed over.
    PeriodListResponse:
      type: object
      required: [periods]
      properties:
        periods:
          type: array
          items:
            $ref: "#/components/schemas/Period"
    ListItemTitle:
      type: string
      description: Trimmed. An emoji at the start is shown as the item's emoji.
      minLength: 1
      maxLength: 100
      example: 🥛 Milk
    ListItemFields:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
          nullable: true
        note:
          type: string
          description: Trimmed. A blank note is stored as null.
          maxLength: 200
          nullable: true
        estimatedCents:
          type: integer
          minimum: 1
          maximum: 2147483647
          nullable: true
          description: The estimated cost in cents. Null for no estimate.
    CreateListItemRequest:
      description: Issue #11.
      allOf:
        - type: object
          required: [title]
          properties:
            title:
              $ref: "#/components/schemas/ListItemTitle"
        - $ref: "#/components/schemas/ListItemFields"
    UpdateListItemRequest:
      description: Issue #11. At least one field. The title can't be cleared.
      minProperties: 1
      allOf:
        - type: object
          properties:
            title:
              $ref: "#/components/schemas/ListItemTitle"
        - $ref: "#/components/schemas/ListItemFields"
    ListItem:
      type: object
      required:
        [
          id,
          groupId,
          title,
          quantity,
          note,
          estimatedCents,
          status,
          addedBy,
          completedBy,
          completedAt,
          expenseId,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        title:
          type: string
        quantity:
          type: integer
          nullable: true
        note:
          type: string
          nullable: true
        estimatedCents:
          type: integer
          nullable: true
        status:
          type: string
          enum: [open, done]
        addedBy:
          type: string
          format: uuid
          description: The user who added it.
        completedBy:
          type: string
          format: uuid
          nullable: true
          description: The user who checked it off (#12). Null while open.
        completedAt:
          type: string
          format: date-time
          nullable: true
        expenseId:
          type: string
          format: uuid
          nullable: true
          description: The expense it was checked off with (#12). Null while open, for no cost, or once that expense was deleted on its own.
        createdAt:
          type: string
          format: date-time
    ListedItem:
      description: An item in the list response (#12).
      allOf:
        - $ref: "#/components/schemas/ListItem"
        - type: object
          required: [costCents, expenseLock]
          properties:
            costCents:
              type: integer
              nullable: true
              description: What a done item cost. Null while open or for no cost.
            expenseLock:
              type: string
              enum: [settled, settle-up]
              nullable: true
              description: Why its expense can't be deleted, so it can't be unchecked (#86). Null when it can.
    ListItemResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: "#/components/schemas/ListItem"
    ListItemListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListedItem"
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Sam Lee
        email:
          type: string
          format: email
          description: Trimmed and stored lowercase.
          example: sam@example.com
        password:
          type: string
          minLength: 8
          description: At least 8 characters and at most 72 bytes.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Matched case-insensitively.
        password:
          type: string
          minLength: 1
    User:
      type: object
      required: [id, email, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Group:
      type: object
      required: [id, name, isPersonal, archivedAt, createdAt, readOnly, members]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: 🏠 Flat
        isPersonal:
          type: boolean
        archivedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        readOnly:
          type: boolean
          description: |
            True when the user left the group or it is archived. Writes to
            it get 403.
        members:
          type: array
          description: |
            Current members, in the order they joined. For a former member,
            the members as they were when they left, themselves included,
            and not people who joined later.
          items:
            $ref: "#/components/schemas/Member"
    GroupSummary:
      allOf:
        - $ref: "#/components/schemas/Group"
        - type: object
          required: [leftAt]
          properties:
            leftAt:
              type: string
              format: date-time
              nullable: true
              description: When the user left, or null if they are a current member.
    Member:
      type: object
      required: [userId, name, defaultShareWeight]
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
        defaultShareWeight:
          $ref: "#/components/schemas/ShareWeight"
    ShareWeight:
      type: integer
      description: |
        A member's part of the group's default ratio. 60/40 is stored as 3
        and 2; an even group is 1 for everyone. Capped at 100 so splitting
        the largest amount stays exact.
      minimum: 1
      maximum: 100
    GroupResponse:
      type: object
      required: [group]
      properties:
        group:
          $ref: "#/components/schemas/Group"
    GroupStanding:
      allOf:
        - $ref: "#/components/schemas/GroupSummary"
        - type: object
          required: [balanceCents, shareThisPeriodCents, openItemCount]
          properties:
            balanceCents:
              type: integer
              description: |
                The user's balance in the group this period. Positive means
                the group owes them; negative means they owe the group.
            shareThisPeriodCents:
              type: integer
              minimum: 0
              description: The user's shares of the group's expenses this period.
            openItemCount:
              type: integer
              minimum: 0
    PersonalOverview:
      type: object
      required: [group, spentThisMonthCents, openEstimateCents, openItems]
      properties:
        group:
          $ref: "#/components/schemas/GroupSummary"
        spentThisMonthCents:
          type: integer
          minimum: 0
          description: Expenses in the personal space dated this month (UTC).
        openEstimateCents:
          type: integer
          minimum: 0
          description: The estimates of the open items; an item with no estimate adds nothing.
        openItems:
          type: array
          items:
            $ref: "#/components/schemas/ListItem"
    Overview:
      type: object
      required:
        - netCents
        - owingCents
        - owedCents
        - groupShareThisPeriodCents
        - personal
        - groups
        - readOnlyGroups
      properties:
        netCents:
          type: integer
          description: owedCents minus owingCents, across the user's current groups.
        owingCents:
          type: integer
          minimum: 0
          description: The sum of the groups where the user owes, as a positive amount.
        owedCents:
          type: integer
          minimum: 0
          description: The sum of the groups where the user is owed.
        groupShareThisPeriodCents:
          type: integer
          minimum: 0
          description: The user's share of every current group's expenses this period.
        personal:
          allOf:
            - $ref: "#/components/schemas/PersonalOverview"
          nullable: true
        groups:
          type: array
          description: The shared groups the user is in now, in the order they joined.
          items:
            $ref: "#/components/schemas/GroupStanding"
        readOnlyGroups:
          type: array
          description: Groups the user left, and archived ones.
          items:
            $ref: "#/components/schemas/GroupSummary"
    OverviewResponse:
      type: object
      required: [overview]
      properties:
        overview:
          $ref: "#/components/schemas/Overview"
    SidebarGroup:
      type: object
      required: [id, name, isPersonal]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        isPersonal:
          type: boolean
        balanceCents:
          type: integer
          description: |
            The user's balance in a shared group: positive when the group owes
            them, negative when they owe it. Absent for the personal space and
            for a group whose balance couldn't be loaded.
    SidebarGroupListResponse:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/SidebarGroup"
    GroupListResponse:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupSummary"
    MemberResponse:
      type: object
      required: [member]
      properties:
        member:
          $ref: "#/components/schemas/Member"
    GroupName:
      type: string
      description: Trimmed. An emoji at the start becomes the group's tile.
      minLength: 1
      maxLength: 60
      example: 🏠 Flat
    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/GroupName"
    UpdateGroupRequest:
      type: object
      minProperties: 1
      properties:
        name:
          $ref: "#/components/schemas/GroupName"
        memberWeights:
          type: array
          description: Every current member once. User ids are compared in any case.
          minItems: 1
          items:
            type: object
            required: [userId, weight]
            properties:
              userId:
                type: string
                format: uuid
              weight:
                $ref: "#/components/schemas/ShareWeight"
    InviteRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Matched case-insensitively.
          example: sam@example.com
    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    HealthResponse:
      description: Issue #100. Nothing else is ever added, so nothing leaks.
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, error]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: FORBIDDEN
            message:
              type: string
              example: You are not a member of this group.
            fields:
              type: object
              description: Only on 400. One message per invalid field.
              additionalProperties:
                type: string
              example:
                password: Password must be at least 8 characters.
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
