openapi: 3.0.3
info:
  title: Everyday planning and shared costs
  version: 0.1.0
  description: |
    Draft route list moved from AGENTS.md. A personal space is a group with
    `isPersonal: true` and uses the same group routes. Paths are plural
    kebab-case. JSON keys are camelCase.

    Status codes: 400 invalid input, 401 not logged in or token expired,
    403 logged in but not allowed, 404 not found, 409 conflict (duplicate
    email, editing a settled expense, leaving with a balance).

    Error body: { "error": { "code": "FORBIDDEN", "message": "You are not a member of this group." } }
paths:
  /api/auth/register:
    post:
      summary: Create an account (also creates the personal space)
      description: Issues #4, #23.
      responses:
        "400":
          $ref: "#/components/responses/Error"
  /api/auth/login:
    post:
      summary: Log in, set the session cookie
      description: Issue #4.
      responses:
        "401":
          $ref: "#/components/responses/Error"
  /api/auth/logout:
    post:
      summary: Clear the session cookie
      description: Issue #4.
      responses:
        "401":
          $ref: "#/components/responses/Error"
  /api/auth/me:
    get:
      summary: Current user
      description: Issue #4.
      responses:
        "401":
          $ref: "#/components/responses/Error"
  /api/overview:
    get:
      summary: Personal total, share per group, net balance
      description: Issue #10.
      responses:
        "401":
          $ref: "#/components/responses/Error"
  /api/groups:
    get:
      summary: List my groups
      description: Issue #6.
      responses:
        "401":
          $ref: "#/components/responses/Error"
    post:
      summary: Create a group
      description: Issue #6.
      responses:
        "400":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}:
    get:
      summary: Group details
      description: Issues #6, #8.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "403":
          $ref: "#/components/responses/Error"
    patch:
      summary: Rename a group or set its default split ratio
      description: Issues #6, #8.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "400":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/invitations:
    post:
      summary: Invite by email
      description: Issue #6.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "400":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/leave:
    post:
      summary: Leave a group
      description: Issue #22. Leaving with a non-zero balance is 409.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "409":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/list-items:
    get:
      summary: List items
      description: Issues #11, #12.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "403":
          $ref: "#/components/responses/Error"
    post:
      summary: Add an item
      description: Issues #11, #12.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "400":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/list-items/{itemId}:
    patch:
      summary: Edit an item
      description: Issues #11, #12.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/ItemId"
      responses:
        "400":
          $ref: "#/components/responses/Error"
    delete:
      summary: Remove an item
      description: Issues #11, #12.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/ItemId"
      responses:
        "404":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/list-items/{itemId}/complete:
    post:
      summary: Check off an item and create the expense
      description: Issues #12, #13.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/ItemId"
      responses:
        "400":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/expenses:
    get:
      summary: List expenses (with filters)
      description: Issues #7, #15.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "403":
          $ref: "#/components/responses/Error"
    post:
      summary: Add an expense
      description: Issues #7, #15.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "400":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/expenses/{expenseId}:
    patch:
      summary: Edit an unsettled expense
      description: Issue #20. A settled expense is 409. A non-payer gets 403.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/ExpenseId"
      responses:
        "409":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete an unsettled expense
      description: Issue #20. A settled expense is 409. A non-payer gets 403.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/ExpenseId"
      responses:
        "409":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/balances:
    get:
      summary: Each member's net balance
      description: Issue #9.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "403":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/bills/me:
    get:
      summary: My itemized bill (current or past period)
      description: Issue #21.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "403":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/payments:
    post:
      summary: Record a direct payment
      description: Issue #14.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "400":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/payments/{paymentId}/confirm:
    post:
      summary: Recipient confirms a payment
      description: Issues #14, #19.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "403":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/settlements:
    post:
      summary: Start a settle-up and get suggested payments
      description: Issue #19.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "409":
          $ref: "#/components/responses/Error"
  /api/groups/{groupId}/settlements/current:
    get:
      summary: Current settle-up and its payments
      description: Issue #19.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "404":
          $ref: "#/components/responses/Error"
components:
  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: string
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: FORBIDDEN
            message:
              type: string
              example: You are not a member of this group.
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
